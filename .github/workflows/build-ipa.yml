name: Build IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the IPA'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA for iOS 15+
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          # objectVersion 70 needs Xcode 16+. Prefer the newest available.
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config meson || pip3 install --break-system-packages meson
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/libarchive/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/libarchive/lib/pkgconfig" >> $GITHUB_ENV
          if [ -d "/opt/homebrew/opt/lld/bin" ] && [ -d "/opt/homebrew/opt/llvm/bin" ]; then
            sudo ln -sf /opt/homebrew/opt/lld/bin/* /opt/homebrew/opt/llvm/bin/ || true
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Restore native dependencies cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: native-deps-${{ runner.os }}-${{ hashFiles('deps/build_*.sh', 'deps/prepare_*.sh', '.gitmodules') }}

      - name: Build native dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x deps/*.sh
          echo "==> Building LAME..."
          ./deps/build_lame.sh
          echo "==> Building FFmpeg..."
          ./deps/build_ffmpeg.sh
          echo "==> Building iSH..."
          ./deps/build_ish.sh
          echo "==> Preparing Alpine rootfs..."
          ./deps/prepare_alpine_rootfs.sh
          echo "==> Building rclone..."
          ./deps/build_rclone_ios.sh

      - name: Prepare configuration templates
        run: |
          cp -n src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig || true

      - name: Verify DSH agent module sources are present
        run: |
          # The DSH agent framework port is compiled through an Xcode
          # file-system-synchronized group rooted at src/ios/DSH. A missing file
          # fails the build with an opaque linker error, so check for the
          # expected files first.
          expected=(
            src/ios/DSH/DSHTypes.swift
            src/ios/DSH/DSHSystemPrompt.swift
            src/ios/DSH/DSHToolRegistry.swift
            src/ios/DSH/DSHToolScheduler.swift
            src/ios/DSH/DSHToolGate.swift
            src/ios/DSH/DSHSession.swift
            src/ios/DSH/DSHCompaction.swift
            src/ios/DSH/DSHTurnDriver.swift
            src/ios/DSH/DSHJSONSchema.swift
            src/ios/DSH/DSHToolSchemaBridge.swift
            src/ios/DSH/DSHToolDispatchBridge.swift
            src/ios/DSH/DSHMinisPrompt.swift
            src/ios/DSH/DSHMinisTools.swift
            src/ios/DSH/DSHPromptAdapter.swift
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "DSH agent module is incomplete — check the DSH synchronized group."
            exit 1
          fi
          echo "DSH agent module: ${#expected[@]} files present"

          # The group must be wired into the Minis target, or Xcode silently
          # compiles none of the sources and the build fails with
          # 'cannot find dshSystemPrompt in scope'.
          if ! grep -q "D5A1000100000000000000D51 /\* DSH \*/" src/ios/Minis.xcodeproj/project.pbxproj; then
            echo "DSH synchronized group is not declared in project.pbxproj"
            exit 1
          fi
          echo "DSH synchronized group is declared"

      - name: Build iOS App (Release)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_DIR=$(find build/Build/Products/Release-iphoneos -name "Minis.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: Minis.app not found under build/Build/Products/Release-iphoneos"
            find build -name "*.app" -type d || true
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/

          # Core iOS 15 build: omit optional extensions (Live Activity widget and
          # Share Extension). The main app's chat/agent/shell features do not
          # require either extension.
          rm -rf "Payload/Minis.app/PlugIns/AgentWidgetExtension.appex" "Payload/Minis.app/PlugIns/MinisShare.appex"

          # Re-sign every embedded framework individually, innermost first.
          #
          # The "Strip Third-Party VAD Framework Symbols" build phase runs
          # `strip -x` on RealTimeCutVADCXXLibrary.framework and only re-signs
          # when EXPANDED_CODE_SIGN_IDENTITY is set. This build runs with
          # CODE_SIGNING_ALLOWED=NO, so that re-sign is skipped and the
          # framework ships with a signature its stripped binary no longer
          # satisfies. dyld then refuses to load it and the app dies at launch
          # with "Library not loaded: ... (code signature invalid)".
          #
          # `codesign --deep` does not fix this: it signs the outer bundle and
          # leaves nested Mach-Os carrying their broken signatures. Each
          # framework needs its own --force pass, deepest first.
          if [ -d "Payload/Minis.app/Frameworks" ]; then
            find "Payload/Minis.app/Frameworks" -mindepth 1 -depth -type d -name "*.framework" | while read -r fw; do
              echo "re-signing $fw"
              codesign --force --sign - --timestamp=none "$fw" || {
                echo "ERROR: failed to re-sign $fw"
                exit 1
              }
            done
            # Verify every nested binary now passes verification.
            find "Payload/Minis.app/Frameworks" -type f -name "*.framework" -prune -o -true >/dev/null
            for fw in "Payload/Minis.app/Frameworks"/*.framework; do
              [ -d "$fw" ] || continue
              codesign --verify "$fw" || { echo "ERROR: $fw failed verification"; exit 1; }
            done
          fi

          # Ad-hoc sign the remaining bundle while preserving the entitlements
          # startup storage needs. Signing with `-` and no entitlements file
          # strips App Group access, and the app then gets nil from
          # containerURL.
          codesign --force --sign - \
            --entitlements src/ios/Minis.entitlements \
            "Payload/Minis.app"

          # Final gate: the whole bundle must verify, or dyld will reject a
          # nested binary at launch and the app will die with no visible error.
          codesign --verify --deep --strict "Payload/Minis.app" || {
            echo "ERROR: app bundle failed signature verification"
            exit 1
          }
          echo "note: app bundle signature verified"

          STAMP=$(date -u +%Y%m%d-%H%M%S)
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="Minis-DSH-${SHORT_SHA}-${STAMP}-unsigned.ipa"
          zip -q -r9 "$OUT" Payload
          echo "IPA_NAME=$OUT" >> $GITHUB_ENV
          ls -lh "$OUT"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-DSH-IPA
          path: Minis-DSH-*-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          files: Minis-DSH-*-unsigned.ipa
          name: Minis DSH build (${{ github.ref_name }})
          tag_name: ${{ github.ref_name }}
          body: |
            Minis with the DSH agent framework port, built unsigned for iOS 15+ (arm64).

            - **Install**: upload with ios-mcp (`POST /upload_file`) then `install_app`, or use TrollStore / Sideloadly.
            - **Target**: iOS 15.0+ (arm64), tested on iPhone 13 / iOS 15.3.1.
            - **Agent core**: DSH port under `src/ios/Agent/DSH`. Toggle with `AIChatViewModel.useDSHAgentLoop`.
          draft: false
          prerelease: false
